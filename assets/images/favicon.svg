<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ringed planet">
  <!--
    Favicon for ffenjil.com - a little ringed planet, same idea as the
    background on the site. Kept deliberately chunky: at 16px anything
    finer than this just turns to mud in the browser tab.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a38"/>
      <stop offset="1" stop-color="#05060e"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#f6e0b6"/>
      <stop offset="0.55" stop-color="#d2a874"/>
      <stop offset="1"   stop-color="#7d5a34"/>
    </linearGradient>
    <!-- Only the near half of the ring passes in front of the planet -->
    <clipPath id="nearHalf">
      <rect x="0" y="34" width="64" height="30"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <circle cx="12" cy="13" r="1.6" fill="#ffffff" opacity=".95"/>
  <circle cx="53" cy="17" r="1.1" fill="#cfe0ff" opacity=".8"/>
  <circle cx="50" cy="50" r="1.3" fill="#ffffff" opacity=".65"/>
  <circle cx="15" cy="52" r="1"   fill="#ffd9b0" opacity=".7"/>

  <!-- Ring, far half: drawn first so the planet covers what sits behind it -->
  <g transform="rotate(-20 32 34)">
    <ellipse cx="32" cy="34" rx="26" ry="8.5" fill="none" stroke="#e7d2a6" stroke-width="4.5" opacity=".9"/>
  </g>

  <circle cx="32" cy="34" r="15" fill="url(#body)"/>

  <!-- Ring, near half: back over the top of the planet -->
  <g transform="rotate(-20 32 34)" clip-path="url(#nearHalf)">
    <ellipse cx="32" cy="34" rx="26" ry="8.5" fill="none" stroke="#f2e0ba" stroke-width="4.5"/>
  </g>
</svg>
